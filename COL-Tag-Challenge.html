<!DOCTYPE html>
<html lang="en">
    <head>
       <title>My COL Tag Callenge</title>
       <meta charset="UTF-8">
    </head>
    <body>
        <h1>My COL Tag Challenge</h1>
        <p>This is a paragraph of text that will be styled using the COL tag.</p>
        <!--table row here -->
        <table border="1">
            <colgroup>
                <col style="background-color: lightblue;">
                <col style="background-color: lightgreen;">
            </colgroup>
                <tr>
                  <th>Name</th>
                  <th>Age</th>
                </tr>
                <tr>
                  <td>John</td>
                  <td>28</td>
                </tr>
                <tr>
                  <td>Jane</td>
                  <td>32</td>
                </tr>    
        </table>
    </body>
</html>
